services:
  postgres:
    image: postgres:16-alpine
    container_name: shopkit_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-shopkit}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-shopkit}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-shopkit} -d ${DB_NAME:-shopkit}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shopkit_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: shopkit_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-shopkit}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopkit_backend
    restart: always
    environment:
      NODE_ENV: production
      # SEED_DEMO_DATA is deliberately absent: production must never seed demo
      # logins. OWNER_* bootstraps the first admin and is ignored once one exists.
      OWNER_EMAIL: ${OWNER_EMAIL}
      OWNER_PASSWORD: ${OWNER_PASSWORD}
      DATABASE_URL: postgresql://${DB_USER:-shopkit}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-shopkit}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-15m}
      JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES:-7d}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:-Sample Store <orders@example.com>}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-shopkit}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-shopkit-images}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      NUXT_URL: ${NUXT_URL}
      # Google OAuth. AuthModule only registers the strategy when
      # GOOGLE_CLIENT_ID is non-empty, so leaving these unset in .env keeps the
      # feature off cleanly -- but omitting them from this file entirely meant
      # they could never be set at all, and /auth/google 500d in production
      # while the login page and the guest-checkout CTA both link to it.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nuxt:
    build:
      context: .
      dockerfile: Dockerfile.nuxt
    container_name: shopkit_nuxt
    restart: always
    environment:
      NODE_ENV: production
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE}
      NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      # Absolute public origin. Without it siteUrl falls back to localhost:3000
      # and the schema.org Store entity plus og:image publish localhost URLs.
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL}
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: shopkit_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - nuxt
      - backend
      - minio

volumes:
  postgres_data:
  redis_data:
  minio_data:
