events {
  worker_connections 1024;
}

http {
  server_tokens off;

  gzip on;
  gzip_types text/html application/json text/css application/javascript text/javascript;

  upstream nuxt {
    server nuxt:3000;
  }

  upstream backend {
    server backend:3001;
  }

  # Rate limiting zones.
  #
  # The API zone was 30r/m, which is half a request per second for everything a
  # browsing customer does -- product list, categories, brands, favourites,
  # settings. A single page view spends several of those, and any group behind
  # one address (carrier-grade NAT on mobile, an office, a school) shares the
  # bucket, so ordinary browsing produced 503s. 600r/m with a burst absorbs a
  # normal session while still stopping a scraper.
  #
  # Auth stays deliberately tight: it guards password attempts, and a legitimate
  # user hits it a handful of times at most.
  limit_req_zone $binary_remote_addr zone=api:10m rate=600r/m;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

  # HTTP → HTTPS redirect
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    client_max_body_size 10M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API → NestJS backend
    location /api/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://backend/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth routes — stricter rate limit
    location /api/auth/ {
      limit_req zone=auth burst=5 nodelay;
      proxy_pass http://backend/auth/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check (bypass rate limit)
    location /health {
      proxy_pass http://backend/health;
      proxy_http_version 1.1;
    }

    # Product images → MinIO.
    #
    # Without this block MinIO is unreachable from the browser in production and
    # every product photo 404s, while working perfectly in dev (where the dev
    # compose maps port 9000 to the host).
    #
    # MINIO_PUBLIC_URL must be set to https://<domain>/media so minio.service.ts
    # rewrites presigned URLs onto this path.
    #
    # The Host header is pinned to minio:9000 on purpose. Presigned S3 URLs sign
    # the host, so forwarding the public hostname makes MinIO reject signatures
    # it issued itself. Do not replace this with $host.
    location /media/ {
      proxy_pass http://minio:9000/;
      proxy_http_version 1.1;
      proxy_set_header Host minio:9000;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Images are large relative to API payloads and already compressed.
      proxy_buffering off;
      gzip off;
    }

    # Everything else → Nuxt SSR
    location / {
      proxy_pass http://nuxt;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }
  }
}
